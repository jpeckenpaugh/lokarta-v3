<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lokarta: Come Into The Light</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Top Global App Header -->
    <header class="app-header">
      <div class="logo-group">
        <span class="game-icon"><img class="openmoji-icon header-icon" src="./assets/openmoji/1F56F.svg" alt="Candle" /></span>
        <h1 class="game-title">LOKARTA</h1>
        <span class="tagline">Come Into The Light</span>
      </div>
      <div class="system-controls">
        <span class="engine-badge">v2.3</span>
        <button id="header-guide-btn" class="header-btn" title="View Controls & Gameplay Guide">
          <img class="openmoji-icon btn-emoji" src="./assets/openmoji/1F4D6.svg" alt="Guide" /> Guide
        </button>
        <button id="audio-toggle-btn" class="audio-btn" title="Toggle Sound FX">
          🔊 Sound: ON
        </button>
      </div>
    </header>

    <!-- Main Game Frame -->
    <div class="main-frame">
      <!-- Center Stage: Canvas Viewport & Bottom Combat Log -->
      <main class="center-stage">
        <section class="viewport-panel" id="viewport-panel">
          <div class="canvas-wrapper">
            <canvas id="game-canvas"></canvas>
            <!-- Mobile / Touch Controls Overlay -->
            <div class="touch-controls" id="touch-controls">
              <div></div>
              <button class="touch-btn" data-key="ArrowUp" data-dir="up">▲</button>
              <div></div>
              <button class="touch-btn" data-key="ArrowLeft" data-dir="left">◀</button>
              <div></div>
              <button class="touch-btn" data-key="ArrowRight" data-dir="right">▶</button>
              <div></div>
              <button class="touch-btn" data-key="ArrowDown" data-dir="down">▼</button>
              <div></div>
            </div>
          </div>
        </section>

        <!-- Combat & Event Log Panel -->
        <section class="combat-log-panel" id="combat-log-container">
          <div class="panel-header">COMBAT & EVENT LOG</div>
          <div class="log-entries-scroll" id="log-entries-container"></div>
        </section>
      </main>

      <!-- Sidebar HUD: Status, Paperdoll, Backpack, Hotbar -->
      <aside class="sidebar-hud" id="sidebar-hud">
        <!-- Status & Level / Vocation Bars -->
        <div class="hud-panel status-panel" id="status-bars-container"></div>

        <!-- Paperdoll Equipment (4 Slots) -->
        <div class="hud-panel paperdoll-panel" id="paperdoll-container"></div>

        <!-- Backpack 6 Slots -->
        <div class="hud-panel backpack-panel" id="backpack-container"></div>

        <!-- Actions & Abilities 10 Slots (2 Rows of 5) -->
        <div class="hud-panel hotbar-panel" id="hotbar-container"></div>
      </aside>
    </div>

    <!-- Modals & Overlays (Title Screen, Character Select, Fate Grant, Guide, Victory, Defeat) -->
    <div id="modal-overlay" class="modal-overlay"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
